{% extends "base.html" %}

{% block title %}
Edit Review
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow">

        <div class="card-body">

            <h3>Edit Review</h3>

            <hr>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-dark">
                    Update Review
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
